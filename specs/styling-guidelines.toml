[guide]
name = "Editorial Minimal Retail"
goal = "A product-focused, accessible retail UI with a small bundle and simple code."
implementation = "Tailwind CSS 4 over semantic HTML and project-owned React components."

[principles]
items = [
  "Prioritize product imagery, typography, and whitespace over decoration.",
  "Design mobile-first and progressively enhance wider layouts.",
  "Use native controls and restrained motion.",
  "Keep Tailwind out of API, cache, configuration, hooks, and models."
]

[colors]
background = "#FAFAF8"
surface = "#FFFFFF"
surface_muted = "#F3F2EE"
text = "#181816"
text_muted = "#6B6963"
border = "#E2E0DA"
primary = "#7C2635"
primary_foreground = "#FFFFFF"
error = "#B42318"
focus = "#7C2635"

[tokens]
format = "Semantic CSS custom properties consumed by Tailwind."
rules = [
  "Use library-independent names such as --color-surface and --space-4.",
  "Centralize color, spacing, radius, typography, and motion values.",
  "Do not export Tailwind class strings from business modules."
]

[typography]
font = "System sans-serif stack"
page_title = "2.25rem to 3rem, weight 600"
section_title = "1.5rem, weight 600"
product_model = "1rem, weight 500"
product_price = "0.9375rem to 1rem, weight 600, tabular numbers"
product_brand = "0.75rem, uppercase, tracked"
body = "0.9375rem to 1rem, line-height 1.6"

[layout]
max_width_px = 1280
page_padding_px = [16, 24, 32]
spacing_scale_px = [4, 8, 12, 16, 24, 32, 48, 64]
rules = [
  "Use shared Container and PageHeader components for repeated page geometry.",
  "Use CSS Grid for catalogue and product-detail layouts.",
  "Avoid horizontal overflow at 320px."
]

[product_list]
columns = "1 below 640px, 2 from 640px, 3 from 1024px, 4 from 1280px"
rules = [
  "Introduce the catalogue with a compact editorial hero containing title, result count, and search.",
  "Keep loading, empty, error, and no-results states inside the catalogue region.",
  "Keep grid geometry stable while results change.",
  "Stack full-width search below the title on mobile."
]

[product_card]
rules = [
  "Make the complete card a semantic product-details link.",
  "Use a square muted image area with object-fit contain.",
  "Show brand, model, and price below the image.",
  "Use a subtle surface border and shadow, with restrained hover elevation.",
  "Reserve image dimensions and provide a visible focus outline.",
  "Limit hover image scale to 1.02."
]

[product_details]
layout = "Two columns on desktop; one stacked column on mobile."
rules = [
  "Use a large contained product image.",
  "Render specifications with a semantic description list and thin separators.",
  "Group selectors in a lightly tinted purchase panel with a strong full-width add-to-cart button."
]

[components]
rules = [
  "Build shared primitives on native HTML under src/shared/ui.",
  "Expose semantic props such as variant, size, tone, and state.",
  "Keep product-specific presentation under features/products/components.",
  "Do not add a component, CSS-in-JS, or animation library for minor interactions."
]

[accessibility]
target = "WCAG 2.2 AA"
rules = [
  "Use semantic landmarks, headings, lists, links, buttons, labels, and description lists.",
  "Provide complete keyboard navigation and visible focus.",
  "Use at least 44px practical touch targets.",
  "Never communicate status through color alone.",
  "Announce asynchronous errors and cart feedback."
]

[feedback]
loading = "Skeletons preserve final dimensions."
empty = "Concise heading and explanation."
error = "Plain-language message with Retry when possible."
image_failure = "Quiet placeholder preserving image geometry and product name."

[performance]
rules = [
  "Use system fonts and individually imported Lucide icons.",
  "Lazy-load offscreen list images and reserve their dimensions.",
  "Avoid CSS-in-JS and decorative animation dependencies.",
  "Measure production CSS and JavaScript gzip sizes after UI milestones."
]

[testing]
rule = "Assert behavior, semantics, and accessibility; do not assert Tailwind utility names."

[qa]
viewports_px = [320, 375, 768, 1024, 1280, 1440]
checks = [
  "No horizontal overflow or clipped content.",
  "Catalogue never exceeds four columns.",
  "Images remain contained and aligned.",
  "Keyboard focus is always visible.",
  "Layout remains usable at 200 percent zoom and reduced motion."
]
