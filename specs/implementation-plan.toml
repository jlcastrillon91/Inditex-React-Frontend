[project]
name = "inditex-react-frontend"
description = "React SPA for browsing mobile devices and adding configured products to a cart."
framework = "React 19"
language = "JavaScript"
build_tool = "Vite"
node = "24.19.0 LTS"
api_base_url = "https://itx-frontend-test.onrender.com"
architecture = "specs/architecture.toml"
styling = "specs/styling-guidelines.toml"

[versions]
policy = "Use LTS releases when published; otherwise use stable releases and commit package-lock.json."
prohibited = ["alpha", "beta", "rc", "canary", "experimental", "nightly"]

[scripts]
start = "vite"
build = "vite build"
test = "vitest run"
lint = "eslint ."

[foundation]
package_manager = "npm"
import_alias = "@/ -> src/"
environment_variable = "VITE_API_BASE_URL"
routes = ["/", "/product/:productId", "*"]
libraries = [
  "react",
  "react-router-dom",
  "tailwindcss",
  "lucide-react",
  "localstorage-slim",
  "vitest",
  "testing-library",
  "msw"
]

[requirements.application]
items = [
  "Implement product-list and product-details routes as a client-side SPA.",
  "Share the application header across routes.",
  "Provide loading, empty, error, not-found, and broken-image states.",
  "Use semantic HTML, keyboard navigation, visible focus, and accessible labels.",
  "Support mobile through wide-desktop layouts without horizontal overflow."
]

[requirements.product_list]
endpoint = "GET /api/product"
items = [
  "Display every product with image, brand, model, and price.",
  "Make each product a semantic link to /product/:productId.",
  "Use a responsive grid with no more than four columns.",
  "Paginate filtered results by 12 products and persist the page in the URL.",
  "Filter by brand and model in real time and case-insensitively.",
  "Persist the search query in the URL and show a no-results state."
]

[requirements.product_details]
endpoint = "GET /api/product/:id"
attributes = [
  "brand",
  "model",
  "price",
  "cpu",
  "ram",
  "operating system",
  "display resolution",
  "battery",
  "cameras",
  "dimensions",
  "weight"
]
items = [
  "Use two columns on desktop and one stacked column on mobile.",
  "Show the image, required attributes, selectors, and a back link.",
  "Normalize inconsistent API fields and provide missing-value fallbacks."
]

[requirements.cart]
endpoint = "POST /api/cart"
request_fields = ["id", "colorCode", "storageCode"]
items = [
  "Always show storage and color selectors and default to the first option.",
  "Prevent duplicate requests while submission is pending.",
  "Treat the returned count as authoritative and display it in the header.",
  "Persist the cart count safely in localStorage.",
  "Provide accessible success and error feedback."
]

[requirements.cache]
storage = "localStorage"
ttl_minutes = 60
items = [
  "Cache successful product list and detail GET responses.",
  "Discard expired, malformed, or incompatible entries.",
  "Never cache failed requests or cart mutations.",
  "Keep caching independent from React."
]

[[milestones]]
order = 1
name = "Foundation"
status = "complete"
work = [
  "Create Vite application, scripts, routing, Tailwind, test setup, environment config, and shared primitives.",
  "Create the folder boundaries defined in specs/architecture.toml."
]
done_when = "Start, lint, test, and build succeed."

[[milestones]]
order = 2
name = "API and cache"
status = "complete"
work = [
  "Implement API client, environment handling, expiring cache, product API, and product normalization.",
  "Cover success, error, expiry, corruption, and abort behavior with tests."
]
done_when = "Components do not access fetch or localStorage directly."

[[milestones]]
order = 3
name = "Product data hooks"
status = "complete"
work = [
  "Implement useProducts and useProduct with loading, success, error, abort, and retry behavior."
]
done_when = "Hooks expose stable UI-ready state and use the cached product API."

[[milestones]]
order = 4
name = "Product list"
status = "complete"
work = [
  "Implement the responsive product grid, cards, image fallback, skeleton, page states, and URL-controlled pagination."
]
done_when = "Every API product renders accessibly from one to four columns."

[[milestones]]
order = 5
name = "Product search"
status = "complete"
work = [
  "Add an accessible search input, URL query synchronization, filtering, count, and no-results state."
]
done_when = "Search matches brand and model and survives navigation."

[[milestones]]
order = 6
name = "Product details"
status = "in_progress"
work = [
  "Implement the detail route, responsive description, required attributes, selectors, and fallbacks."
]
progress = "Product fetching, route, name heading, loading, not-found, and retry states are complete."
done_when = "Valid, missing, loading, and failed products render controlled states."

[[milestones]]
order = 7
name = "Cart"
status = "pending"
work = [
  "Implement shared cart count, persistence, selectors, add-to-cart request, pending protection, and feedback."
]
done_when = "A successful request updates and persists the authoritative header count."

[[milestones]]
order = 8
name = "Final verification"
status = "pending"
work = [
  "Verify accessibility, responsive layouts, cache behavior, cart persistence, tests, lint, build, and README."
]
done_when = "The complete user journey passes automated and browser checks."

[delivery]
required = [
  "npm run lint",
  "npm run test",
  "npm run build",
  "Browser verification at mobile and desktop widths",
  "README with setup, scripts, environment, architecture, and assumptions"
]
